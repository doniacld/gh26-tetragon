# kind config for the EC2 VM: the VM's port 80 goes to NodePort 30080, which
# deploy/ec2/frontend-public.yaml points at the frontend. Who can reach port 80
# is decided by the EC2 security group (approved ranges only, never 0.0.0.0/0).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP

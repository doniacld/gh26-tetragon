# Environment for the Copilot coding agent: the repo needs Go 1.26.
name: Copilot Setup Steps

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", check-latest: true, cache: false }
      - run: go build ./...
